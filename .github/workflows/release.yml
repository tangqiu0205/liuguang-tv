name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing stable tag using the current packaging layout"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Prepare draft release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release tag and checkout
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          head_commit=$(git rev-parse --verify HEAD)
          version=$(python build/release.py validate-tag "$RELEASE_TAG")
          tag_commit=$(git rev-parse --verify "refs/tags/${RELEASE_TAG}^{commit}")
          test "$head_commit" = "$tag_commit"
          if [ ! -f build/package_release.py ]; then
            echo "This tag predates portable.flag packaging; rerun its original workflow instead" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
      - name: Check out workflow release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Validate update prerequisites
        env:
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$MYGO_UPDATER_PRIVATE_KEY" ]; then
            echo "MYGO_UPDATER_PRIVATE_KEY must be configured before releasing" >&2
            exit 1
          fi
          python release-tools/build/release.py validate-changelog "$RELEASE_VERSION" CHANGELOG.md
      - name: Create or reuse release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: python release-tools/build/publish_release.py draft "$RELEASE_TAG" CHANGELOG.md

  icons:
    needs: metadata
    uses: ./.github/workflows/icons.yml
    with:
      ref: ${{ needs.metadata.outputs.commit }}

  build:
    name: ${{ matrix.name }}
    needs: [metadata, icons]
    permissions:
      contents: write
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS-arm64, runner: macos-15, platform: "darwin/arm64" }
          - { name: macOS-amd64, runner: macos-15-intel, platform: "darwin/amd64" }
          - { name: Windows-amd64, runner: windows-2022, platform: "windows/amd64" }
          - { name: Windows-arm64, runner: windows-11-arm, platform: "windows/arm64" }
          - { name: Linux-amd64, runner: ubuntu-24.04, platform: "linux/amd64" }
          - { name: Linux-arm64, runner: ubuntu-24.04-arm, platform: "linux/arm64" }
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: "0"
      RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          architecture: ${{ matrix.name == 'Windows-arm64' && 'arm64' || '' }}
      - uses: actions/setup-python@v5
        if: matrix.name != 'Windows-arm64'
        with:
          python-version: "3.12"
      - uses: actions/setup-python@v5
        if: matrix.name == 'Windows-arm64'
        with:
          python-version: "3.12"
          architecture: arm64
      - name: Install Linux runtime libraries
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgl1 libegl1
      - name: Test packaging
        run: python -m unittest discover -s build -p 'test_*.py' -v
      - name: Test and vet native platforms
        run: |
          go test ./...
          go vet ./...
      - uses: actions/download-artifact@v4
        with:
          name: app-icons
          path: .icon-artifacts
      - name: Embed Windows application icon
        if: startsWith(matrix.platform, 'windows/')
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          icon=.icon-artifacts/dist/icons/liuguangtv.ico
          test -f "$icon"
          arch=${PLATFORMS#windows/}
          go run github.com/tc-hib/go-winres@v0.3.3 simply --icon "$icon" --manifest none --arch "$arch" --out cmd/liuguangtv/rsrc
          test -f "cmd/liuguangtv/rsrc_windows_$arch.syso"
      - name: Generate macOS application icon
        if: startsWith(matrix.platform, 'darwin/')
        run: |
          set -euo pipefail
          mkdir -p dist/LiuguangTV.iconset
          for size in 16 32 128 256 512; do
            cp ".icon-artifacts/dist/icons/liuguangtv-$size.png" "dist/LiuguangTV.iconset/icon_${size}x${size}.png"
            double=$((size * 2))
            cp ".icon-artifacts/dist/icons/liuguangtv-$double.png" "dist/LiuguangTV.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns dist/LiuguangTV.iconset -o dist/LiuguangTV.icns
      - name: Build packages and signed updates
        env:
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PLATFORMS: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
          python build/release.py set-mygo-version "$RELEASE_VERSION" mygo.json
          if [[ "$PLATFORMS" == darwin/* ]]; then
            python -c 'import json; p="mygo.json"; c=json.load(open(p, encoding="utf-8")); c.setdefault("macos", {})["icon"]="dist/LiuguangTV.icns"; open(p,"w",encoding="utf-8").write(json.dumps(c))'
          fi
          export MYGO_LDFLAGS="-X main.version=$RELEASE_VERSION"
          go tool mygo build -platform "$PLATFORMS"
      - name: Collect packages and Windows portable ZIPs
        env:
          PLATFORMS: ${{ matrix.platform }}
        run: python build/package_release.py --version "$RELEASE_VERSION" --platform "$PLATFORMS" --output "dist/release/$RELEASE_VERSION"
      - name: Upload packages to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            files+=("$file")
          done < <(find "dist/release/$RELEASE_VERSION" -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0)
          test "${#files[@]}" -gt 0
          gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/release/${{ needs.metadata.outputs.version }}/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [metadata, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: packages-*
          path: release-assets
      - name: Check out workflow release tools
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tools
          persist-credentials: false
      - name: Verify signed updates
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          mkdir publish-assets
          for target in macOS-arm64 macOS-amd64 Windows-amd64 Windows-arm64 Linux-amd64 Linux-arm64; do
            (cd "release-assets/packages-$target" && sha256sum --check SHA256SUMS.txt)
            find "release-assets/packages-$target" -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec cp -n -t publish-assets/ {} +
          done
          go run ./build/verifyupdate -dir publish-assets -version "$RELEASE_VERSION"
          python release-tools/build/release.py release-notes publish-assets release-notes.md
          python build/release.py checksums publish-assets $(cd publish-assets && printf '%s\n' *)
          (cd publish-assets && sha256sum --check SHA256SUMS.txt)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: python release-tools/build/publish_release.py publish "$RELEASE_TAG" publish-assets release-notes.md
